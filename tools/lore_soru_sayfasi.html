<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Grenze+Gotisch:wght@500;600&display=swap">
<style>
/* Düzen: solda soru defteri (bölümler, kartlar), sağda yapışık harita; dar ekranda harita üstte, katlanabilir. */
:root {
  --paper: #e9e1cd; --leaf: #f2ecdc; --ink: #2a2219; --ink-soft: #64563f; --rule: #bfae8b;
  --accent: #8b2c1d; --moss: #3f5d47; --wash: rgba(139, 44, 29, .10); --mapframe: #cfc5ad;
  --display: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --body: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --r-gocebe: #b8722a; --r-imparatorluk: #9b2b22; --r-sinir: #3b5f8a; --r-dag: #6a3f86;
  --r-dag_maden: #5e5a55; --r-vadi: #3f7a45; --r-ahit: #1d1a17; --r-guney: #a88a17;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #16130f; --leaf: #201b15; --ink: #e8dec8; --ink-soft: #b3a68b; --rule: #4b4032;
  --accent: #d86b52; --moss: #8db898; --wash: rgba(216, 107, 82, .14); --mapframe: #2b251d;
  --r-ahit: #d9d2c4; --r-dag_maden: #a7a29a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #16130f; --leaf: #201b15; --ink: #e8dec8; --ink-soft: #b3a68b; --rule: #4b4032;
  --accent: #d86b52; --moss: #8db898; --wash: rgba(216, 107, 82, .14); --mapframe: #2b251d;
  --r-ahit: #d9d2c4; --r-dag_maden: #a7a29a; color-scheme: dark }
:root { --map: url("data:image/jpeg;base64,__MAP__"); }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 18px/1.5 var(--body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 20px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: grid; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 5vw, 52px); line-height: 1; margin: 0; letter-spacing: .01em; }
.lede { margin: 0; color: var(--ink-soft); max-width: 68ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 16px; }
.progress { flex: 1 1 240px; min-width: 0; height: 8px; background: var(--leaf); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--moss); transition: width .3s; }
.count { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.save-state { font-style: italic; color: var(--ink-soft); }
button, .chip { font: inherit; font-size: 15px; color: var(--ink); background: var(--leaf); border: 1px solid var(--rule);
  border-radius: 3px; padding: 4px 11px; cursor: pointer; }
button:hover, .chip:hover { border-color: var(--ink-soft); }
button:focus-visible, textarea:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
nav.secs { display: flex; flex-wrap: wrap; gap: 6px; }
nav.secs button span { color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-left: 4px; }
nav.secs button.on span { color: var(--paper); opacity: .75; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 46%); gap: 28px; margin-top: 18px; align-items: start; }
.mapcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } .mapcol { position: relative; top: 0; order: -1; } }

/* Harita */
.mapbox { position: relative; aspect-ratio: 1 / 1; max-width: 100%; max-height: calc(100vh - 120px); margin-inline: auto;
  background: var(--mapframe); border: 1px solid var(--rule); overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.mapbox.drag { cursor: grabbing; }
@media (max-width: 980px) { .mapbox { max-height: 62vh; } .mapcol.hide .mapbox, .mapcol.hide .maptools .opt { display: none; } }
.stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
.stage .img { position: absolute; inset: 0; background: var(--map) 0 0 / 100% 100% no-repeat; }
:root[data-theme="dark"] .stage .img { filter: brightness(.82) contrast(1.05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage .img { filter: brightness(.82) contrast(1.05); } }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.poly { fill: transparent; stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; opacity: .9; }
.poly.lit { fill: var(--wash); stroke-width: 3; stroke-dasharray: none; }
.mk { position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--z, 1))); transform-origin: 50% 50%;
  display: flex; align-items: center; gap: 4px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.mk .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #f4ecd9; box-shadow: 0 0 0 1px #2a2219; flex: none; }
.mk.big .dot { width: 16px; height: 16px; }
.mk .lbl { font-size: 13px; font-weight: 600; color: #231c14; text-shadow: 0 0 3px #f1e8d3, 0 0 3px #f1e8d3, 0 0 2px #f1e8d3; }
.mk.pl .dot { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); background: #f1e8d3; border: 1.5px solid #2a2219; box-shadow: none; }
.mk.pl .lbl { font-weight: 500; font-style: italic; font-size: 12px; }
.mk.pl .lbl, .mk.town .lbl { display: none; }
.stage.z15 .mk.town .lbl, .stage.z22 .mk.pl:not(.quiet) .lbl, .stage.z4 .mk.pl .lbl { display: inline; }
.stage.z22 .rlabel { opacity: 0; }
.mk:hover .lbl, .mk:focus-visible .lbl { display: inline; }
.mk.ping .dot { animation: ping 1.2s ease-out 2; }
@keyframes ping { 0% { box-shadow: 0 0 0 1px #2a2219, 0 0 0 0 rgba(139,44,29,.8); } 100% { box-shadow: 0 0 0 1px #2a2219, 0 0 0 18px rgba(139,44,29,0); } }
.rlabel { transition: opacity .3s; position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--z, 1))); pointer-events: none;
  font-family: var(--display); font-size: 17px; color: #2a2219; opacity: .82; text-shadow: 0 0 4px #efe6d0, 0 0 4px #efe6d0; white-space: nowrap; }
.maptools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; font-size: 15px; }
.maptools .sp { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
@media (prefers-reduced-motion: reduce) { .stage { transition: none !important; } .mk.ping .dot { animation: none; } }

/* Sorular */
.sec-head { margin: 4px 0 14px; }
.sec-head h2 { font-family: var(--display); font-weight: 500; font-size: 32px; margin: 0; }
.sec-head p { margin: 2px 0 0; color: var(--ink-soft); max-width: 68ch; }
.item { background: var(--leaf); border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 18px; }
.item > header { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.item > header .ttl { min-width: 0; flex: 1 1 200px; }
.item h3 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15; }
.item .sub { color: var(--ink-soft); font-size: 15px; }
.thumb { width: 180px; max-width: 100%; aspect-ratio: 360 / 203; object-fit: cover; border: 1px solid var(--rule); flex: none; }
.mini { width: 120px; aspect-ratio: 1; border: 1px solid var(--rule); background-image: var(--map); background-repeat: no-repeat; flex: none; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--ink-soft); margin-top: 4px; }
.facts em { font-style: normal; color: var(--ink); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.qs { display: grid; }
.qrow { padding: 12px 16px 14px; border-top: 1px dashed var(--rule); display: grid; gap: 6px; }
.qrow:first-child { border-top: 0; }
.qtext { margin: 0; }
.qmeta { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--ink-soft); letter-spacing: .04em; }
.qmeta .pr { color: var(--accent); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.qmeta .done { color: var(--moss); font-weight: 600; }
.qmeta .fly { margin-left: auto; font-size: 13px; padding: 1px 8px; }
.hint { margin: 0; font-style: italic; color: var(--ink-soft); font-size: 16px; }
.draft { margin: 2px 0 2px; padding: 8px 12px; border-left: 3px solid var(--moss); background: var(--leaf); font-size: 16px; }
.draft b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--moss); font-weight: 600; }
.draft p { margin: 2px 0 0; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
textarea { width: 100%; min-height: 64px; resize: vertical; font: 17px/1.45 var(--body); color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--wash); } to { background: transparent; } }
.empty { padding: 30px 16px; color: var(--ink-soft); font-style: italic; }
.note { border: 1px solid var(--accent); color: var(--ink); background: var(--wash); padding: 8px 12px; font-size: 16px; }
.copyout { width: 100%; min-height: 160px; font-size: 14px; }
.sum { background: var(--leaf); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 18px 18px; }
.sum h3 { font-size: 20px; font-weight: 600; letter-spacing: .06em; margin: 22px 0 6px; }
.sum ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.sum li { max-width: 72ch; }
.sum .src { font-size: 14px; color: var(--ink-soft); letter-spacing: .03em; }
.sum .intro { color: var(--ink-soft); font-style: italic; margin: 14px 0 0; max-width: 72ch; }
</style>

<div class="wrap">
  <header class="top">
    <h1>__TITLE__</h1>
    <p class="lede">__LEDE__</p>
    <div class="bar">
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <span class="count" id="count">0 / 0 cevaplandı</span>
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <button id="onlyOpen" type="button">Yalnızca boş olanlar</button>
      <button id="onlyPrio" type="button">Yalnızca öncelikliler</button>
      <button id="copyAll" type="button">Cevapları kopyala</button>
    </div>
    <div id="dbNote" class="note" hidden>Kayıt şu an bu tarayıcıda tutuluyor (sunucuya ulaşılamadı). Bitirince “Cevapları kopyala” ile metni al.</div>
    <textarea id="copyOut" class="copyout" hidden readonly aria-label="Bütün cevaplar"></textarea>
    <nav class="secs" id="secs" aria-label="Bölümler"></nav>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside class="mapcol" id="mapcol">
      <div class="mapbox" id="mapbox" aria-label="Sideria haritası">
        <div class="stage" id="stage">
          <div class="img"></div>
          <svg id="polys" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="maptools">
        <button type="button" id="zin" aria-label="Yakınlaştır">+</button>
        <button type="button" id="zout" aria-label="Uzaklaştır">−</button>
        <button type="button" id="zall">Bütün harita</button>
        <span class="sp"></span>
        <button type="button" class="opt on" id="tRegions">Bölgeler</button>
        <button type="button" class="opt on" id="tPlaces">Adı konmuş yerler</button>
        <button type="button" id="tHide">Haritayı gizle</button>
      </div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
</div>

<script>
const DATA = __DATA__;
const THUMBS = __THUMBS__;
const COLORS = {};
const css = getComputedStyle(document.documentElement);
for (const k in DATA.regions) COLORS[k] = `var(--r-${k})`;

// ---------- cevap durumu
const answers = {};          // qid -> {text, choice}
const meta = {};             // qid -> {q, section, title}
let db = null, saveTimers = {}, pending = 0;
const LS = "sideria-sorular";
function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(answers)); } catch (e) {} }
Object.assign(answers, lsLoad());

function isAnswered(a) { return !!a && ((a.text || "").trim() !== "" || (a.choice || "") !== ""); }

// ---------- harita
const box = document.getElementById("mapbox"), stage = document.getElementById("stage");
let view = { z: 1, x: 0, y: 0 };
function size() { return box.clientWidth; }
function clampView() {
  const s = size(), w = s * view.z;
  view.z = Math.min(8, Math.max(1, view.z));
  view.x = Math.min(0, Math.max(s - s * view.z, view.x));
  view.y = Math.min(0, Math.max(s - s * view.z, view.y));
}
function apply(anim) {
  clampView();
  stage.style.transition = anim ? "transform .55s cubic-bezier(.2,.7,.2,1)" : "none";
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  stage.style.setProperty("--z", view.z);
  stage.classList.toggle("z15", view.z >= 1.6); stage.classList.toggle("z22", view.z >= 2.2); stage.classList.toggle("z4", view.z >= 4);
}
function zoomAt(f, cx, cy) {
  const nz = Math.min(8, Math.max(1, view.z * f));
  view.x = cx - (cx - view.x) * (nz / view.z);
  view.y = cy - (cy - view.y) * (nz / view.z);
  view.z = nz; apply(false);
}
function flyTo(u, v, z) {
  const s = size(); view.z = z; view.x = s / 2 - u * s * z; view.y = s / 2 - v * s * z; apply(true);
  if (window.matchMedia("(max-width: 980px)").matches) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pts = new Map(); let last = null, pinch = null, moved = 0;
box.addEventListener("pointerdown", e => { if (e.target.closest(".mk")) return; box.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; box.classList.add("drag"); });
box.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = box.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d; return;
  }
  view.x += e.clientX - prev[0]; view.y += e.clientY - prev[1]; moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); apply(false);
});
function up(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) box.classList.remove("drag"); }
box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
document.getElementById("zin").onclick = () => zoomAt(1.4, size() / 2, size() / 2);
document.getElementById("zout").onclick = () => zoomAt(1 / 1.4, size() / 2, size() / 2);
document.getElementById("zall").onclick = () => { view = { z: 1, x: 0, y: 0 }; apply(true); };
new ResizeObserver(() => apply(false)).observe(box);

// bölge çokgenleri
const svg = document.getElementById("polys"), polyEls = {};
for (const p of DATA.polys) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  el.setAttribute("points", p.pts.map(([u, v]) => `${u * 1000},${v * 1000}`).join(" "));
  el.setAttribute("class", "poly"); el.style.stroke = COLORS[p.key];
  svg.appendChild(el); (polyEls[p.key] ||= []).push(el);
}
// bölge adları: çokgenlerin ağırlık merkezinde
const rlabels = [];
for (const p of DATA.polys) {
  let u = 0, v = 0; for (const [a, b] of p.pts) { u += a; v += b; } u /= p.pts.length; v /= p.pts.length;
  const l = document.createElement("div"); l.className = "rlabel"; l.textContent = DATA.regions[p.key];
  l.style.left = (u * 100) + "%"; l.style.top = (v * 100) + "%"; stage.appendChild(l); rlabels.push(l);
}
const markers = {};
for (const s of DATA.settlements) {
  const m = document.createElement("button"); m.type = "button";
  m.className = "mk" + (s.big ? " big" : " town"); m.style.left = (s.pos[0] * 100) + "%"; m.style.top = (s.pos[1] * 100) + "%";
  m.innerHTML = `<span class="dot" style="background:${COLORS[s.region]}"></span><span class="lbl"></span>`;
  m.querySelector(".lbl").textContent = s.name; m.setAttribute("aria-label", s.name + ", sorulara git");
  m.style.background = "none"; m.style.border = "0"; m.style.padding = "0";
  m.onclick = () => openItem("yerlesimler", "settlement:" + s.id);
  stage.appendChild(m); markers["settlement:" + s.id] = m;
}
const placeItems = new Map();
for (const sec of DATA.sections) for (const it of sec.items) if (it.kind === "place") placeItems.set(it.title, it);
const placeEls = [];
for (const p of DATA.places) {
  const it = placeItems.get(p.n);
  const m = document.createElement(it ? "button" : "div");
  m.className = "mk pl" + (it ? "" : " quiet"); m.style.left = (p.pos[0] * 100) + "%"; m.style.top = (p.pos[1] * 100) + "%";
  m.innerHTML = `<span class="dot"></span><span class="lbl"></span>`; m.querySelector(".lbl").textContent = p.n;
  m.title = `${p.n} · ${p.k}`;
  if (it) { m.type = "button"; m.style.background = "none"; m.style.border = "0"; m.style.padding = "0";
    m.onclick = () => openItem("izler", "place:" + it.key); markers["place:" + it.key] = m; }
  stage.appendChild(m); placeEls.push(m);
}
function toggle(btn, fn) { btn.onclick = () => { btn.classList.toggle("on"); fn(btn.classList.contains("on")); }; }
toggle(document.getElementById("tRegions"), on => { svg.style.display = on ? "" : "none"; rlabels.forEach(l => l.hidden = !on); });
toggle(document.getElementById("tPlaces"), on => placeEls.forEach(m => m.hidden = !on));
document.getElementById("tHide").onclick = e => { const c = document.getElementById("mapcol"); c.classList.toggle("hide");
  e.target.textContent = c.classList.contains("hide") ? "Haritayı göster" : "Haritayı gizle"; };
const legend = document.getElementById("legend");
for (const k in DATA.regions) { const s = document.createElement("span"); s.innerHTML = `<b style="background:${COLORS[k]}"></b>`;
  s.append(DATA.regions[k]); legend.appendChild(s); }
function ping(key) { const m = markers[key]; if (!m) return; m.classList.remove("ping"); void m.offsetWidth; m.classList.add("ping"); }
function lightRegion(key) { for (const k in polyEls) polyEls[k].forEach(e => e.classList.toggle("lit", k === key)); }

// ---------- sorular
let current = "ozet", onlyOpen = false, onlyPrio = false;
const main = document.getElementById("main"), secsNav = document.getElementById("secs");
const S = Object.fromEntries(DATA.settlements.map(s => [s.id, s]));
for (const sec of DATA.sections) for (const it of sec.items) for (const q of it.qs) meta[q.id] = { q: q.t, section: sec.title, title: it.title };

function regionBox(key) {
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const p of DATA.polys) if (p.key === key) for (const [u, v] of p.pts) { x0 = Math.min(x0, u); y0 = Math.min(y0, v); x1 = Math.max(x1, u); y1 = Math.max(y1, v); }
  return [x0, y0, x1, y1];
}
function itemFly(it) {
  if (it.kind === "settlement") { const s = S[it.key]; return [s.pos[0], s.pos[1], 3.2]; }
  if (it.kind === "place") return [it.pos[0], it.pos[1], 3.6];
  if (it.kind === "region") { const [x0, y0, x1, y1] = regionBox(it.key); const w = Math.max(x1 - x0, y1 - y0) + .06;
    return [(x0 + x1) / 2, (y0 + y1) / 2, Math.min(5, 1 / w)]; }
  return null;
}
function renderNav() {
  secsNav.innerHTML = "";
  const sb = document.createElement("button"); sb.type = "button"; sb.className = current === "ozet" ? "on" : "";
  sb.textContent = "Eldeki lore";
  sb.onclick = () => { current = "ozet"; try { history.replaceState(null, "", "#ozet"); } catch (e) {} render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  secsNav.appendChild(sb);
  for (const sec of DATA.sections) {
    const all = sec.items.flatMap(i => i.qs), done = all.filter(q => isAnswered(answers[q.id])).length;
    const b = document.createElement("button"); b.type = "button"; b.className = sec.id === current ? "on" : "";
    b.textContent = sec.title; const sp = document.createElement("span"); sp.textContent = `${done}/${all.length}`; b.appendChild(sp);
    b.onclick = () => { current = sec.id; try { history.replaceState(null, "", "#" + sec.id); } catch (e) {} render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    secsNav.appendChild(b);
  }
  const all = DATA.sections.flatMap(s => s.items.flatMap(i => i.qs)), done = all.filter(q => isAnswered(answers[q.id])).length;
  document.getElementById("count").textContent = `${done} / ${all.length} cevaplandı`;
  document.getElementById("prog").style.width = (100 * done / all.length) + "%";
}
function headerFor(it) {
  const h = document.createElement("header"), ttl = document.createElement("div"); ttl.className = "ttl";
  const h3 = document.createElement("h3"); h3.textContent = it.title; ttl.appendChild(h3);
  const facts = document.createElement("div"); facts.className = "facts";
  const add = (label, val) => { const s = document.createElement("span"); s.append(label + " "); const e = document.createElement("em"); e.textContent = val; s.appendChild(e); facts.appendChild(s); };
  if (it.kind === "settlement") {
    const s = S[it.key];
    if (THUMBS[s.id]) { const img = document.createElement("img"); img.className = "thumb"; img.alt = s.name + " şehir önü (oyun)";
      img.src = "data:image/jpeg;base64," + THUMBS[s.id]; h.appendChild(img); }
    const sub = document.createElement("div"); sub.className = "sub";
    sub.innerHTML = `<span class="swatch" style="background:${COLORS[s.region]}"></span>`; sub.append(`${s.type} · ${DATA.regions[s.region]} · ${s.wall}`);
    ttl.appendChild(sub);
    add("üretir", s.produces.join(", ")); add("arar", s.demands.join(", ")); add("yol", s.neighbours + " komşu");
  } else if (it.kind === "region") {
    const [x0, y0, x1, y1] = regionBox(it.key), w = Math.max(x1 - x0, y1 - y0) + .04, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const mini = document.createElement("div"); mini.className = "mini"; mini.setAttribute("role", "img"); mini.setAttribute("aria-label", it.title + " bölgesi, harita kesiti");
    mini.style.backgroundSize = (100 / w) + "% " + (100 / w) + "%";
    const px = Math.min(1, Math.max(0, (cx - w / 2) / (1 - w))), py = Math.min(1, Math.max(0, (cy - w / 2) / (1 - w)));
    mini.style.backgroundPosition = (px * 100) + "% " + (py * 100) + "%";
    h.appendChild(mini);
    const sub = document.createElement("div"); sub.className = "sub";
    sub.innerHTML = `<span class="swatch" style="background:${COLORS[it.key]}"></span>`;
    const here = DATA.settlements.filter(s => s.region === it.key).map(s => s.name);
    sub.append(here.length ? "Yerleşimler: " + here.join(", ") : "Oynanabilir yerleşim yok");
    ttl.appendChild(sub);
  } else if (it.sub) { const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = it.sub; ttl.appendChild(sub); }
  if (facts.childNodes.length) ttl.appendChild(facts);
  h.appendChild(ttl);
  const fly = itemFly(it);
  if (fly) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Haritada göster";
    b.onclick = () => { flyTo(...fly); if (it.kind === "region") lightRegion(it.key); else { lightRegion(null); ping(it.kind + ":" + it.key); } };
    h.appendChild(b); }
  return h;
}
function qRow(q) {
  const row = document.createElement("div"); row.className = "qrow"; row.id = "q-" + q.id;
  const m = document.createElement("div"); m.className = "qmeta";
  if (q.p) { const p = document.createElement("span"); p.className = "pr"; p.textContent = "öncelikli"; m.appendChild(p); }
  const st = document.createElement("span"); st.className = "done"; m.appendChild(st);
  if (q.at) { const b = document.createElement("button"); b.type = "button"; b.className = "fly"; b.textContent = "Haritada göster";
    b.onclick = () => { lightRegion(null); flyTo(q.at[0], q.at[1], q.at[2]); }; m.appendChild(b); }
  const t = document.createElement("p"); t.className = "qtext"; t.textContent = q.t;
  row.append(m, t);
  if (q.h) { const h = document.createElement("p"); h.className = "hint"; h.textContent = q.h; row.appendChild(h); }
  if (q.d) { const d = document.createElement("div"); d.className = "draft"; const l = document.createElement("b"); l.textContent = q.dl || "Önerim";
    d.appendChild(l); for (const para of q.d.split("\n")) { const p = document.createElement("p"); p.textContent = para; d.appendChild(p); } row.appendChild(d); }
  const a = answers[q.id] || {};
  if (q.c) {
    const ch = document.createElement("div"); ch.className = "choices"; ch.setAttribute("role", "group");
    for (const c of q.c) { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c;
      b.setAttribute("aria-pressed", a.choice === c ? "true" : "false");
      b.onclick = () => { const cur = answers[q.id] || {}; const val = cur.choice === c ? "" : c;
        answers[q.id] = { ...cur, choice: val }; ch.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.textContent === val ? "true" : "false"));
        mark(); save(q.id, 0); };
      ch.appendChild(b); }
    row.appendChild(ch);
  }
  const ta = document.createElement("textarea"); ta.id = "ta-" + q.id; ta.value = a.text || "";
  ta.placeholder = q.c ? "Gerekçe ya da 'Başka' ise kendi cevabın (isteğe bağlı)" : "Cevabın…";
  ta.setAttribute("aria-label", q.t);
  ta.oninput = () => { answers[q.id] = { ...(answers[q.id] || {}), text: ta.value }; mark(); save(q.id, 900); grow(ta); };
  row.appendChild(ta); requestAnimationFrame(() => grow(ta));
  function mark() { st.textContent = isAnswered(answers[q.id]) ? "yazıldı" : ""; }
  mark(); return row;
}
function grow(ta) { ta.style.height = "auto"; ta.style.height = Math.max(64, ta.scrollHeight + 2) + "px"; }
function renderSummary() {
  main.innerHTML = "";
  const head = document.createElement("div"); head.className = "sec-head";
  head.innerHTML = "<h2>Eldeki lore</h2><p>Bugüne kadar kesinleşen her şey, düz madde madde. Yer tutucu, reddedilmiş ve terk edilmiş bilgi yok. (Yazar) senin cevapların ve onayların, (Oyun) oyunda yazılı olan, (Harita) onaylı harita v3. En sonda onay bekleyen önerilerim ve çelişkiler.</p>";
  main.appendChild(head);
  const box = document.createElement("div"); box.className = "sum"; let ul = null;
  for (const raw of DATA.summary.split("\n")) {
    const line = raw.trim(); if (!line) { ul = null; continue; }
    if (line.startsWith("- ")) {
      if (!ul) { ul = document.createElement("ul"); box.appendChild(ul); }
      const li = document.createElement("li"), body = line.slice(2), m = body.match(/^\(([^)]+)\)\s*/);
      if (m) { const s = document.createElement("span"); s.className = "src"; s.textContent = "(" + m[1] + ") "; li.appendChild(s); li.append(body.slice(m[0].length)); }
      else li.textContent = body;
      ul.appendChild(li);
    } else if (/^[A-ZÇĞİÖŞÜ0-9 ,:()\-]+$/.test(line) && line.length < 80) {
      const h = document.createElement("h3"); h.textContent = line; box.appendChild(h); ul = null;
    } else { const p = document.createElement("p"); p.className = "intro"; p.textContent = line; box.appendChild(p); ul = null; }
  }
  main.appendChild(box);
}
function render() {
  renderNav();
  if (current === "ozet") { renderSummary(); return; }
  const sec = DATA.sections.find(s => s.id === current);
  main.innerHTML = "";
  const head = document.createElement("div"); head.className = "sec-head";
  head.innerHTML = "<h2></h2><p></p>"; head.querySelector("h2").textContent = sec.title; head.querySelector("p").textContent = sec.lead;
  main.appendChild(head);
  let shown = 0;
  for (const it of sec.items) {
    const qs = it.qs.filter(q => (!onlyOpen || !isAnswered(answers[q.id])) && (!onlyPrio || q.p));
    if (!qs.length) continue;
    const card = document.createElement("section"); card.className = "item"; card.id = "it-" + it.kind + ":" + it.key;
    card.appendChild(headerFor(it));
    const list = document.createElement("div"); list.className = "qs"; qs.forEach(q => list.appendChild(qRow(q)));
    card.appendChild(list); main.appendChild(card); shown += qs.length;
  }
  if (!shown) { const e = document.createElement("p"); e.className = "empty"; e.textContent = "Bu süzgeçle bu bölümde gösterilecek soru kalmadı."; main.appendChild(e); }
}
function openItem(secId, key) {
  if (current !== secId || onlyOpen || onlyPrio) { current = secId; onlyOpen = onlyPrio = false;
    document.getElementById("onlyOpen").classList.remove("on"); document.getElementById("onlyPrio").classList.remove("on"); render(); }
  const el = document.getElementById("it-" + key); if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  ping(key);
}
document.getElementById("onlyOpen").onclick = e => { onlyOpen = !onlyOpen; e.target.classList.toggle("on", onlyOpen); render(); };
document.getElementById("onlyPrio").onclick = e => { onlyPrio = !onlyPrio; e.target.classList.toggle("on", onlyPrio); render(); };

// ---------- kayıt
const stateEl = document.getElementById("saveState");
function save(qid, delay) {
  lsSave(); renderNav();
  clearTimeout(saveTimers[qid]);
  saveTimers[qid] = setTimeout(() => push(qid), delay);
  stateEl.textContent = "yazılıyor…";
}
const inflight = {};
async function push(qid) {
  if (!db) { stateEl.textContent = "bu tarayıcıda saklandı"; return; }
  if (inflight[qid]) { inflight[qid].again = true; return; }
  inflight[qid] = { again: false }; pending++;
  const a = answers[qid] || {}, m = meta[qid];
  try {
    await db.doc("answers/" + qid).set({ qid, section: m.section, about: m.title, question: m.q,
      text: a.text || "", choice: a.choice || "", at: new Date().toISOString() });
    stateEl.textContent = "kaydedildi";
  } catch (e) {
    stateEl.textContent = e && e.code === "invalid_argument" ? "kaydedilemedi: bu sayfada yazma iznin yok" : "kaydedilemedi, tekrar denenecek";
    if (!(e && e.code === "invalid_argument")) setTimeout(() => push(qid), 4000);
  } finally {
    const again = inflight[qid].again; delete inflight[qid]; pending--;
    if (again) push(qid);
  }
}
document.getElementById("copyAll").onclick = async () => {
  const lines = [];
  for (const sec of DATA.sections) for (const it of sec.items) for (const q of it.qs) {
    const a = answers[q.id]; if (!isAnswered(a)) continue;
    lines.push(`- [${sec.title} / ${it.title}] ${q.t}\n  ${[a.choice, a.text].filter(Boolean).join(" — ")}`);
  }
  const txt = lines.join("\n") || "Henüz cevap yok.";
  const out = document.getElementById("copyOut");
  try { await navigator.clipboard.writeText(txt); stateEl.textContent = "panoya kopyalandı"; out.hidden = true; }
  catch (e) { out.hidden = false; out.value = txt; out.focus(); out.select(); stateEl.textContent = "metin aşağıda seçili"; }
};

(async () => {
  render(); apply(false);
  const h = (location.hash || "").slice(1); if (h === "ozet" || DATA.sections.some(s => s.id === h)) { current = h; render(); }
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { db = null; }
  if (!db) { document.getElementById("dbNote").hidden = false; return; }
  let first = true;
  db.collection("answers").onSnapshot(snap => {
    const local = lsLoad();
    for (const d of snap.docs) {
      const v = d.data(); if (!v || !v.qid) continue;
      const ta = document.getElementById("ta-" + v.qid);
      if (ta && document.activeElement === ta) continue;
      if (saveTimers[v.qid] && inflight[v.qid]) continue;
      answers[v.qid] = { text: v.text || "", choice: v.choice || "" };
    }
    if (first) {   // tarayıcıda kalan ama sunucuya gitmemiş taslaklar
      first = false;
      for (const qid in local) if (isAnswered(local[qid]) && !snap.docs.some(d => d.id === qid) && meta[qid]) { answers[qid] = local[qid]; push(qid); }
    }
    lsSave();
    if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") render(); else renderNav();
  }, () => { document.getElementById("dbNote").hidden = false; db = null; });
})();
</script>
