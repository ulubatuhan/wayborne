name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --import

      - name: Export to HTML5
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
        continue-on-error: false

      - name: Debug - check for threading requirement in export
        run: |
          echo "--- context around 'crossOriginIsolated' in index.js ---"
          grep -oP '.{150}crossOriginIsolated.{150}' build/web/index.js || echo "no match"
          echo "--- context around 'Cross Origin Isolation' text (any file) ---"
          grep -orP '.{100}Cross Origin Isolation.{200}' build/web/ || echo "no match"
          echo "--- context around 'SharedArrayBuffer' text (any file) ---"
          grep -orP '.{100}SharedArrayBuffer.{200}' build/web/ || echo "no match"
          ls -la build/web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
