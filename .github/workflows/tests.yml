name: Tests

# Deploy iş akışı yalnızca main'de çalışıyor, yani bir dal main'e
# girmeden doğrulanmıyordu. Bu iş akışı her dalda ve her PR'da koşar:
# projeyi içe aktarır, testleri çalıştırır ve ayrıştırma hatası varsa
# düşer. Dışa aktarım ve dağıtım burada yok - o iş deploy.yml'nin.

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee import.log

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --script res://tests/run_tests.gd 2>&1 | tee tests.log

      # Godot ayrıştırma hatasını basıp yine de sıfırla çıkıyor; hatalı
      # betik yalnızca bir ekranda kullanılıyorsa testler onu hiç görmez.
      - name: Fail on script errors
        if: always()
        run: |
          found=0
          for log in import.log tests.log; do
            [ -f "$log" ] || continue
            if grep -nE 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to create an autoload' "$log"; then
              echo "::error file=$log::$log içinde betik hatası var"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "Godot bu hataları basıp yine de sıfırla çıkıyor; yapı bilerek düşürüldü."
            exit 1
          fi
          echo "Betik hatası yok."
