name: Windows build

# Oyunun asıl hedefi PC (Windows). Web derlemesi tarayıcının bellek sınırına
# takılıyor (SBOX_FATAL_MEMORY_EXCEEDED: ~1,9 GB açık doku), bu yüzden
# oynanabilir sürüm burada üretilir: tek bir Wayborne.exe (paket içine gömülü),
# zip olarak iş akışı çıktısına konur. Çalıştırmak için GitHub'da Actions >
# bu koşu > Artifacts bölümünden indirilir.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "windows"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: |
          set -o pipefail
          if ! godot --headless --import 2>&1 | tee import.log; then
            echo "Import çöktü; bir kez daha deneniyor."
            godot --headless --import 2>&1 | tee import.log
          fi

      - name: Export for Windows
        run: |
          set -o pipefail
          mkdir -p build/windows
          godot --headless --export-release Windows build/windows/Wayborne.exe 2>&1 | tee export.log
          test -s build/windows/Wayborne.exe

      - name: Fail on script errors
        if: always()
        run: |
          found=0
          for log in import.log export.log; do
            [ -f "$log" ] || continue
            if grep -nE 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to create an autoload' "$log"; then
              echo "::error file=$log::$log içinde betik hatası var"
              found=1
            fi
          done
          [ "$found" -eq 0 ] || exit 1
          echo "Betik hatası yok."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Wayborne-Windows
          path: build/windows/Wayborne.exe
          retention-days: 30
          compression-level: 0
