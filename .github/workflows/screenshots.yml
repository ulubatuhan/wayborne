name: Screenshots

# Kritik ekranların fotoğrafını çeker ve betik hatası arar (Godot ayrıştırma
# hatasında bile 0 ile çıkar; bkz. CLAUDE.md Testing). Fotoğraflar iş
# çıktısı olarak indirilebilir. Önceki koşuyla görüntü karşılaştırması
# kullanıcı kararıyla kaldırıldı (2026-11-01, görev Y-K02 iptal).

on:
  push:
    branches:
      - Wayborne
    paths:
      - "scripts/**"
      - "scenes/**"
      - "data/assets/**"
      - "data/locale/**"
      - "tests/screenshot_*.gd"
      - "project.godot"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "screenshots-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Ekran görüntüsü araçları (tests/screenshot_*.gd) bu klasörlere yazıyor.
  GODOT_USER_DIR: ~/.local/share/godot/app_userdata/Wayborne
  SHOT_SCRIPTS: "screenshot_menu screenshot_city_moods screenshot_journey_screen screenshot_combat"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: false

      - name: Install display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: |
            .godot
            **/*.import
            **/*.translation
          key: godot-import-${{ runner.os }}-4.2.2-${{ hashFiles('project.godot') }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ runner.os }}-4.2.2-${{ hashFiles('project.godot') }}-

      - name: Import project
        run: |
          set -o pipefail
          if ! godot --headless --import 2>&1 | tee import.log; then
            echo "Import çöktü; bir kez daha deneniyor."
            godot --headless --import 2>&1 | tee import.log
          fi

      - name: Capture screenshots
        run: |
          set -o pipefail
          mkdir -p shots/current
          for name in $SHOT_SCRIPTS; do
            echo "── $name"
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24" \
              godot --path . --rendering-driver opengl3 --script "res://tests/$name.gd" 2>&1 \
              | tee -a screens.log
          done
          # Araçların hepsi user://<ad>_shots/ altına yazıyor.
          for dir in $(eval echo "$GODOT_USER_DIR")/*_shots; do
            [ -d "$dir" ] && cp -r "$dir" shots/current/
          done
          find shots/current -name '*.png' | wc -l

      - name: Fail on script errors
        if: always()
        run: |
          [ -f screens.log ] || exit 0
          if grep -nE 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to create an autoload' screens.log; then
            echo "::error file=screens.log::screens.log içinde betik hatası var"
            exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: shots/current
          if-no-files-found: ignore
          retention-days: 14
